<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hostel Lost &amp; Found Portal</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- React Root Container -->
  <div id="root">
    <!-- Clean initial placeholder while React mounts -->
    <header>
      <div class="container header-content">
        <div class="logo">
          <h1>Hostel Lost &amp; Found</h1>
        </div>
      </div>
    </header>
    <main class="container" style="padding: 40px 0; text-align: center;">
      <p style="color: #666; font-size: 16px;">Loading portal components...</p>
    </main>
  </div>

  <!-- React 18 & ReactDOM 18 UMD Production Builds -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone to compile JSX in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Main React Application -->
  <script type="text/babel" src="app.jsx"></script>

</body>

</html>
